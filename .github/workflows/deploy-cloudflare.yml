name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: oxyos-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OxyHQ/OxyOS
          ref: master
          path: oxyos
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install exact website dependencies
        run: bun install --frozen-lockfile

      - name: Verify and build the OxyOS shell demo
        working-directory: oxyos/shell
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run lint
          bun run build:web

      - name: Build the combined website artifact
        run: |
          bun run build
          bun run assemble:demo -- oxyos/shell/web-build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=oxyos-website --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
